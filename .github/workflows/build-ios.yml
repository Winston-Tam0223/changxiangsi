name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync
        run: npx cap sync ios

      - name: Pod install
        working-directory: ios/App
        run: |
          pod repo update
          pod install --verbose

      - name: Build archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Pack IPA
        run: |
          mkdir -p ipa-package/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ipa-package/Payload/
          cd ipa-package
          zip -r ../MatchTime-unsigned.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: MatchTime-unsigned-ipa
          path: MatchTime-unsigned.ipa
