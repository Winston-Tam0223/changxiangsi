name: Build PWA iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pwa-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Unzip PWA package
        run: |
          mkdir -p ios-src
          unzip -o "Match Time.zip" -d ios-src

      - name: Pod install
        working-directory: ios-src/src
        run: pod install

      - name: Build for device (no sign)
        working-directory: ios-src/src
        run: |
          xcodebuild build \
            -workspace "Match Time.xcworkspace" \
            -scheme "Match Time" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Pack IPA
        run: |
          ls -la ios-src/src/build/Build/Products/Release-iphoneos/
          mkdir -p ipa-package/Payload
          cp -R "ios-src/src/build/Build/Products/Release-iphoneos/Match Time.app" ipa-package/Payload/
          cd ipa-package
          zip -r ../MatchTime.ipa Payload
          cd ..
          ls -la MatchTime.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MatchTime-ipa
          path: MatchTime.ipa
