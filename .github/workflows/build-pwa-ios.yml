name: Build PWA iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pwa-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p ios-src
          unzip -o "Match Time.zip" -d ios-src

      - name: Pod install
        working-directory: ios-src/src
        run: pod install

      - name: Build
        working-directory: ios-src/src
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "Match Time.xcworkspace" \
            -scheme "Match Time" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tail -50

      - name: List products
        run: ls -la ios-src/src/build/Build/Products/ || true

      - name: Pack IPA
        run: |
          APP=$(find ios-src/src/build -name "*.app" -type d | head -1)
          echo "APP: $APP"
          mkdir -p ipa-package/Payload
          cp -R "$APP" ipa-package/Payload/
          cd ipa-package
          zip -r ../MatchTime.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: MatchTime-ipa
          path: MatchTime.ipa
