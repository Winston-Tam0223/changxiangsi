name: Build PWA iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Match Time.zip'
      - '.github/workflows/build-pwa-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Unzip PWA package
        run: |
          mkdir -p ios-src
          unzip -o "Match Time.zip" -d ios-src
          ls ios-src/src

      - name: Pod install
        working-directory: ios-src/src
        run: pod install

      - name: Build for simulator (no sign)
        working-directory: ios-src/src
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "Match Time.xcworkspace" \
            -scheme "Match Time" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify || true

      - name: Find .app and pack IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/Match Time.app" -maxdepth 6 | head -1)
          echo "APP: $APP_PATH"
          mkdir -p ipa-package/Payload
          cp -R "$APP_PATH" ipa-package/Payload/
          cd ipa-package
          zip -r ../MatchTime.ipa Payload
          cd ..
          ls -la MatchTime.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MatchTime-ipa
          path: MatchTime.ipa
