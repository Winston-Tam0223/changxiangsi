<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录日志｜长相思联盟匹配时间</title>
  <link rel="stylesheet" href="./ui.css?v=4">
</head>
<body>
<div class="lang-bar">
  <button type="button" id="langBtn" class="lang-btn" title="Language">🌐</button>
  <div class="lang-menu" id="langMenu">
    <div class="lang-opt" data-lang="zh-CN">简体中文</div>
    <div class="lang-opt" data-lang="zh-TW">繁體中文</div>
    <div class="lang-opt" data-lang="en">English</div>
  </div>
</div>
<div class="container wide">
  <div class="head"><h1 data-i18n="loginLogTitle">登录日志</h1><div class="sub" id="logUser"></div></div>
  <div class="toolbar">
    <select id="userFilter" onchange="onFilterChange()" style="padding:9px 14px;border-radius:99px;border:1px solid #b8e0ca;background:#fff;color:#8fd4b2;font-size:14px;margin-right:8px">
      <option value="">全部用户</option>
    </select>
    <button class="btn" onclick="exportCsv()" data-i18n="exportCsv">导出 CSV</button>
    <button class="btn danger" id="delUserBtn" style="display:none" onclick="deleteUserLogs()" data-i18n="deleteUserLogs">删除该用户全部日志</button>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th data-i18n="logAccount">登录账号</th><th data-i18n="logPwd">输入密码</th><th data-i18n="logIp">登录IP</th><th data-i18n="logArea">国家/地区</th><th data-i18n="logResult">登录结果</th><th data-i18n="logTime">登录时间</th><th data-i18n="logAction">操作</th></tr></thead>
    <tbody id="logBody"><tr><td colspan="7" class="empty">...</td></tr></tbody>
  </table></div>
  <div class="nav-row"><a class="btn plain" href="./index.html" data-i18n="backHome">返回首页</a><button class="btn danger" onclick="logout()" data-i18n="logout">退出登录</button></div>
</div>

<script src="./auth.js"></script>
<script src="./i18n.js"></script>
<script>
let token = null;
(async function init(){ token = await ensureToken(); if(token) load(); })();
let logs = [];
let nameMap = {}; // email -> 用户名称

async function load(){
  const res = await authFetch('/api/user');
  if(!res.ok){ logout(); return; }
  const user = await res.json();
  document.getElementById('logUser').textContent = t('currentAdmin') + (user.name || user.email);
  if(!user.isAdmin){ alert(t('noPermission')); window.location.href='./index.html'; return; }
  loadUsers();
  loadLogs();
}
// 加载用户列表建立 邮箱->名称 映射
async function loadUsers(){
  try{
    const res = await authFetch('/api/all-users');
    if(res.ok){
      const us = await res.json();
      nameMap = {};
      for(const u of us) nameMap[u.email] = (u.user_metadata||{}).name || '';
    }
  }catch(e){}
}
function displayName(email){ return nameMap[email] ? nameMap[email] : email; }
async function loadLogs(){
  const res = await authFetch('/api/login-logs');
  if(!res.ok){ document.getElementById('logBody').innerHTML='<tr><td colspan="6" class="empty">'+t('readFailed')+'</td></tr>'; return; }
  logs = await res.json();
  buildFilter();
  render();
}
function render(){
  const body = document.getElementById('logBody');
  const filter = document.getElementById('userFilter').value;
  const list = filter ? logs.filter(r=>r.email===filter) : logs;
  if(!list.length){ body.innerHTML='<tr><td colspan="7" class="empty">'+t('noLogs')+'</td></tr>'; return; }
  body.innerHTML = list.map(r=>`
    <tr>
      <td data-label="${t('logAccount')}">${esc(displayName(r.email))}<div style="color:#c5d8cd;font-size:11.5px">${esc(r.email||'')}</div></td>
      <td data-label="${t('logPwd')}">${esc(r.input_pwd||'')}</td>
      <td data-label="${t('logIp')}">${esc(r.ip||'')}</td>
      <td data-label="${t('logArea')}">${esc(translateArea(r.area))}</td>
      <td data-label="${t('logResult')}" class="${r.status==='success'?'ok':'fail'}">${r.status==='success'?t('loginSuccess'):t('loginFailed')}</td>
      <td data-label="${t('logTime')}">${new Date(r.created_at).toLocaleString('zh-CN',{hour12:false})}</td>
      <td data-label="${t('logAction')}"><button class="btn danger small" onclick="deleteLog(${r.id})" data-i18n="deleteLog">删除</button></td>
    </tr>`).join('');
}
// 国家/地区英文→中文映射
const AREA_MAP = {
  'China':'中国','Guangdong':'广东','Qingyuan':'清远','Beijing':'北京','Shanghai':'上海','Guangzhou':'广州','Shenzhen':'深圳','Fujian':'福建','Xiamen':'厦门','Zhejiang':'浙江','Hangzhou':'杭州','Jiangsu':'江苏','Nanjing':'南京','Sichuan':'四川','Chengdu':'成都','Shandong':'山东','Yunnan':'云南','Hubei':'湖北','Wuhan':'湖北','Hunan':'湖南','Henan':'河南','Hebei':'河北','Anhui':'安徽','Jiangxi':'江西','Chongqing':'重庆','Tianjin':'天津','Shaanxi':'陕西','Xi\'an':'西安',
  'Philippines':'菲律宾','Metro Manila':'马尼拉大都会','Manila':'马尼拉','Pasig City':'帕西格市','Cebu':'宿务','Davao':'达沃','Quezon City':'奎松市',
  'Hong Kong':'香港','Taiwan':'台湾','Taipei':'台北','Kaohsiung':'高雄','Macau':'澳门',
  'Japan':'日本','Tokyo':'东京','Osaka':'大阪','Yokohama':'横滨','Seoul':'首尔','Korea':'韩国',
  'United States':'美国','New York':'纽约','Los Angeles':'洛杉矶','San Francisco':'旧金山','California':'加州','Texas':'德州',
  'Singapore':'新加坡','Malaysia':'马来西亚','Kuala Lumpur':'吉隆坡','Thailand':'泰国','Bangkok':'曼谷','Vietnam':'越南','Hanoi':'河内','Ho Chi Minh City':'胡志明市','Indonesia':'印尼','Jakarta':'雅加达','India':'印度','Mumbai':'孟买','Moscow':'莫斯科','Russia':'俄罗斯','United Kingdom':'英国','London':'伦敦','Germany':'德国','France':'法国','Paris':'巴黎','Canada':'加拿大','Australia':'澳大利亚','Sydney':'悉尼','Brazil':'巴西','Sao Paulo':'圣保罗','Mexico':'墨西哥','Mexico City':'墨西哥城','UAE':'阿联酋','Dubai':'迪拜','Saudi Arabia':'沙特','Turkey':'土耳其','Istanbul':'伊斯坦布尔','Egypt':'埃及','Cairo':'开罗','South Africa':'南非','Nigeria':'尼日利亚','Kenya':'肯尼亚','Israel':'以色列','Italy':'意大利','Rome':'罗马','Spain':'西班牙','Madrid':'西班牙','Netherlands':'荷兰','Amsterdam':'阿姆斯特丹','Sweden':'瑞典','Stockholm':'斯德哥尔摩','Switzerland':'瑞士','Zurich':'苏黎世','Poland':'波兰','Warsaw':'华沙','Ukraine':'乌克兰','Argentina':'阿根廷','Chile':'智利','Colombia':'哥伦比亚','Peru':'秘鲁','New Zealand':'新西兰','Pakistan':'巴基斯坦','Bangladesh':'孟加拉','Phnom Penh':'金边','Cambodia':'柬埔寨','Myanmar':'缅甸','Sri Lanka':'斯里兰卡','Nepal':'尼泊尔','Kazakhstan':'哈萨克斯坦','Uzbekistan':'乌兹别克斯坦','Austria':'奥地利','Vienna':'维也纳','Belgium':'比利时','Denmark':'丹麦','Finland':'芬兰','Norway':'挪威','Greece':'希腊','Portugal':'葡萄牙','Ireland':'爱尔兰','Czechia':'捷克','Hungary':'匈牙利','Romania':'罗马尼亚','Bulgaria':'保加利亚','Croatia':'克罗地亚','Slovakia':'斯洛伐克','Slovenia':'斯洛文尼亚','Lithuania':'立陶宛','Latvia':'拉脱维亚','Estonia':'爱沙尼亚','Iceland':'冰岛','Luxembourg':'卢森堡','Malta':'马耳他','Cyprus':'塞浦路斯','Georgia':'格鲁吉亚','Armenia':'亚美尼亚','Azerbaijan':'阿塞拜疆','Mongolia':'蒙古','Uruguay':'乌拉圭','Paraguay':'巴拉圭','Bolivia':'玻利维亚','Venezuela':'委内瑞拉','Guatemala':'危地马拉','Costa Rica':'哥斯达黎加','Panama':'巴拿马','Puerto Rico':'波多黎各','Dominican Republic':'多米尼加','Honduras':'洪都拉斯','El Salvador':'萨尔瓦多','Nicaragua':'尼加拉瓜','Jamaica':'牙买加','Trinidad and Tobago':'特立尼达和多巴哥','Bahamas':'巴哈马','Barbados':'巴巴多斯','Trinidad':'特立尼达','Curacao':'库拉索','Aruba':'阿鲁巴','Sint Maarten':'圣马丁','Guadeloupe':'瓜德罗普','Martinique':'马提尼克','French Guiana':'法属圭亚那','Reunion':'留尼汪','Mayotte':'马约特','New Caledonia':'新喀里多尼亚','French Polynesia':'法属波利尼西亚','Wallis and Futuna':'瓦利斯和富图纳','Saint Pierre and Miquelon':'圣皮埃尔和密克隆','Saint Barthelemy':'圣巴泰勒米','Saint Martin':'法属圣马丁','Monaco':'摩纳哥','Liechtenstein':'列支敦士登','San Marino':'圣马力诺','Vatican City':'梵蒂冈','Andorra':'安道尔','Maldives':'马尔代夫','Mauritius':'毛里求斯','Seychelles':'塞舌尔','Madagascar':'马达加斯加','Tanzania':'坦桑尼亚','Uganda':'乌干达','Ghana':'加纳','Senegal':'塞内加尔','Ivory Coast':'科特迪瓦','Cameroon':'喀麦隆','Ethiopia':'埃塞俄比亚','Kenya':'肯尼亚','Morocco':'摩洛哥','Nigeria':'尼日利亚','Algeria':'阿尔及利亚','Tunisia':'突尼斯','Libya':'利比亚','Sudan':'苏丹','Angola':'安哥拉','Mozambique':'莫桑比克','Zimbabwe':'津巴布韦','Zambia':'赞比亚','Botswana':'博茨瓦纳','Namibia':'纳米比亚','Lesotho':'莱索托','Eswatini':'斯威士兰','Rwanda':'卢旺达','Burundi':'布隆迪','Djibouti':'吉布提','Somalia':'索马里','Eritrea':'厄立特里亚','Equatorial Guinea':'赤道几内亚','Gabon':'加蓬','Congo':'刚果','DR Congo':'刚果（金）','Central African Republic':'中非','Chad':'乍得','Niger':'尼日尔','Mali':'马里','Burkina Faso':'布基纳法索','Guinea':'几内亚','Sierra Leone':'塞拉利昂','Liberia':'利比里亚','Togo':'多哥','Benin':'贝宁','Mauritania':'毛里塔尼亚','Mali':'马里'
};
function translateArea(s){
  if(!s) return '';
  let out = String(s);
  // 长词优先替换，避免短词先替换破坏长词
  const keys = Object.keys(AREA_MAP).sort((a,b)=>b.length-a.length);
  for(const k of keys){ out = out.split(k).join(AREA_MAP[k]); }
  return out;
}
async function deleteLog(id){
  if(!confirm(t('confirmDeleteLog'))) return;
  const res = await authFetch('/api/login-logs/'+id, { method:'DELETE' });
  if(res.ok){ logs = logs.filter(r=>r.id!==id); render(); buildFilter(); }
  else { alert(t('deleteFailed')); }
}
function buildFilter(){
  const sel = document.getElementById('userFilter');
  const emails = [...new Set(logs.map(r=>r.email).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">'+t('allUsers')+'</option>' + emails.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
}
function onFilterChange(){
  const f = document.getElementById('userFilter').value;
  document.getElementById('delUserBtn').style.display = f ? '' : 'none';
  render();
}
async function deleteUserLogs(){
  const email = document.getElementById('userFilter').value;
  if(!email){ alert(t('pleaseSelectUser')); return; }
  if(!confirm(t('confirmDeleteUserLogs', {email}))) return;
  const res = await authFetch('/api/login-logs?email=' + encodeURIComponent(email), { method:'DELETE' });
  if(res.ok){
    logs = logs.filter(r=>r.email !== email);
    document.getElementById('userFilter').value = '';
    document.getElementById('delUserBtn').style.display = 'none';
    buildFilter();
    render();
    alert(t('deleteUserLogsDone'));
  } else {
    alert(t('deleteFailed'));
  }
}
function exportCsv(){
  if(!logs.length){ alert(t('noDataExport')); return; }
  const filter = document.getElementById('userFilter').value;
  const list = filter ? logs.filter(r=>r.email===filter) : logs;
  if(!list.length){ alert(t('noFilterData')); return; }
  const head=[t('logAccount'),t('logPwd'),t('logIp'),t('logArea'),t('logResult'),t('logTime')].join(',');
  const rows=list.map(r=>[displayName(r.email)+'('+r.email+')',r.input_pwd||'',r.ip||'',r.area||'',r.status==='success'?t('loginSuccess'):t('loginFailed'),new Date(r.created_at).toLocaleString('zh-CN',{hour12:false})].map(esc).join(','));
  const blob=new Blob(['\uFEFF'+[head,...rows].join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(currentLang()==='en'?'login_logs_':'登录日志_')+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
  <script src="./ui.js?v=4"></script>
</body>
</html>
