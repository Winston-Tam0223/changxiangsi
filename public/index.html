<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长相思匹配时间发布系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{background:linear-gradient(160deg,#e9f8ef 0%,#f6fcf8 55%,#edfaf2 100%);min-height:100vh;padding:24px 16px}
.lang-bar{position:fixed;top:18px;right:18px;z-index:10}
.lang-bar select{padding:7px 12px;border-radius:99px;border:1px solid #b8e0ca;background:rgba(255,255,255,0.9);color:#2a6b4e;font-size:13px;outline:none;cursor:pointer}
.container{max-width:720px;margin:0 auto}
.head{text-align:center;margin-bottom:24px}
.head h1{color:#2a6b4e;font-size:28px;letter-spacing:1px}
.head .sub{color:#6d9480;font-size:14px;margin-top:8px}
.card{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:18px;padding:20px 22px;box-shadow:0 4px 16px rgba(84,168,125,0.12);border:1px solid rgba(120,190,152,0.28);margin-bottom:14px}
.task-name{font-size:22px;color:#256142;font-weight:700}
.task-beijing{font-size:13.5px;color:#6d9480;margin-top:6px}
.countdown{font-size:20px;color:#1f9d5d;font-weight:700;margin-top:8px}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.btn{display:inline-block;padding:11px 20px;border-radius:99px;border:none;background:linear-gradient(135deg,#56c98a,#34a76c);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 5px 15px rgba(74,179,122,0.22)}
.btn.danger{background:linear-gradient(135deg,#c98a7a,#a56350)}
.empty{text-align:center;color:#88a896;padding:30px 0}
</style>
</head>
<body>
<div class="lang-bar">
  <select id="langSelect" aria-label="language">
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="en">English</option>
  </select>
</div>
<div class="container">
  <div class="head">
    <h1 data-i18n="appTitle">长相思匹配时间发布系统</h1>
    <div class="sub" id="userInfo"></div>
    <div class="sub" id="tzInfo"></div>
  </div>
  <div id="cards"><div class="empty">正在加载任务...</div></div>
  <div class="nav-row" id="navBox"></div>
</div>

<script src="./auth.js"></script>
<script src="./i18n.js"></script>
<script>
let token = null;

(async function init(){
  token = await ensureToken();
  if(!token) return;
  loadUser();
  loadTasks();
})();

document.getElementById('tzInfo').textContent = t('tzInfo') + (Intl.DateTimeFormat().resolvedOptions().timeZone || '本地');

let tasks = [];
let userInfo = null;

async function loadUser(){
  try{
    const res = await authFetch('/api/user');
    if(!res.ok){ logout(); return; }
    userInfo = await res.json();
  }catch(e){ logout(); return; }
  document.getElementById('userInfo').textContent = t('currentUser') + (userInfo.name || userInfo.email);
  const nav = document.getElementById('navBox');
  if(userInfo.isAdmin){
    nav.innerHTML = `
      <a class="btn" href="./admin.html" data-i18n="adminPanel">管理员后台</a>
      <a class="btn" href="./user-manage.html" data-i18n="userManage">用户管理</a>
      <a class="btn" href="./login-log.html" data-i18n="loginLog">登录日志</a>
      <button class="btn danger" onclick="logout()" data-i18n="logout">退出登录</button>`;
    applyLang();
  }else{
    nav.innerHTML = `<button class="btn danger" onclick="logout()" data-i18n="logout">退出登录</button>`;
    applyLang();
  }
}

async function loadTasks(){
  try{
    const res = await authFetch('/api/tasks');
    if(!res.ok){ logout(); return; }
    tasks = await res.json();
  }catch(e){
    document.getElementById('cards').innerHTML = '<div class="empty">⚠️ ' + t('errConn') + '</div>';
    return;
  }
  renderCards();
}

function renderCards(){
  const wrap = document.getElementById('cards');
  if(!tasks.length){ wrap.innerHTML='<div class="empty">'+t('noTasks')+'</div>'; return; }
  wrap.innerHTML = tasks.map(t=>`
    <div class="card">
      <div class="task-name">${esc(t.name)}</div>
      <div class="task-beijing">${t('targetTime')}：${fmt(t.target_beijing_time)}</div>
      <div class="countdown" data-t="${t.target_beijing_time}">${t('started')}</div>
    </div>`).join('');
  tick();
  clearInterval(window._t);
  window._t = setInterval(tick, 1000);
}

function tick(){
  document.querySelectorAll('[data-t]').forEach(el=>{
    const d = new Date(el.getAttribute('data-t'));
    const diff = d - Date.now();
    if(isNaN(d)){ el.textContent=t('started'); return; }
    if(diff<=0){ el.textContent=t('started'); return; }
    const s=Math.floor(diff/1000), dd=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
    el.textContent = (currentLang()==='en' ? ('Remaining '+dd+'d '+h+'h '+m+'m') : ('剩余 '+dd+'天 '+h+'时 '+m+'分'));
  });
}

function fmt(iso){
  const d=new Date(iso); if(isNaN(d)) return '--';
  // 按访问者设备本地时区显示（管理员设置的是北京时间，此处自动换算），格式：年月日 时:分（不含秒）
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
setInterval(()=>{ if(document.visibilityState==='visible') loadTasks(); }, 60000);
</script>
</body>
</html>
