<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户账号管理｜长相思匹配时间发布系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{background:linear-gradient(160deg,#e9f8ef 0%,#f6fcf8 55%,#edfaf2 100%);min-height:100vh;padding:24px 16px}
.lang-bar{position:fixed;top:18px;right:18px;z-index:100}
.lang-btn{width:38px;height:38px;border-radius:50%;border:1px solid #b8e0ca;background:rgba(255,255,255,0.92);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(42,107,78,0.15);padding:0;color:#2a6b4e}
.lang-menu{position:absolute;top:46px;right:0;background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(42,107,78,0.18);border:1px solid #e2f3e9;padding:6px;min-width:132px;display:none}
.lang-menu.show{display:block}
.lang-opt{padding:9px 14px;font-size:13.5px;color:#2a6b4e;border-radius:8px;cursor:pointer;white-space:nowrap;text-align:left}
.lang-opt:hover{background:#eef9f2}
.lang-opt.active{font-weight:700;color:#1f9d5d}
.container{max-width:900px;margin:0 auto}
.head{text-align:center;margin-bottom:22px}
.head h1{color:#2a6b4e;font-size:26px}
.head .sub{color:#6d9480;font-size:13.5px;margin-top:6px}
.card{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:18px;padding:20px 22px;box-shadow:0 4px 16px rgba(84,168,125,0.12);border:1px solid rgba(120,190,152,0.28);margin-bottom:16px}
.f-label{display:block;color:#4c8068;font-size:13.5px;margin:8px 0 6px}
.f-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #b8e0ca;background:#fff;font-size:16px;outline:none;color:#234a38}
.f-input:focus{border-color:#5fc98a;box-shadow:0 0 0 3px rgba(95,201,138,0.15)}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;border:none;background:linear-gradient(135deg,#56c98a,#34a76c);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 5px 15px rgba(74,179,122,0.22)}
.btn.plain{background:#fff;color:#2a6b4e;border:1px solid #b8e0ca;box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#c98a7a,#a56350)}
.btn.small{padding:5px 10px;font-size:12.5px;border-radius:8px;box-shadow:none}
.table-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 3px 12px rgba(84,168,125,0.1)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #e2f3e9;font-size:13.5px;white-space:nowrap}
th{background:#eef9f2;color:#2a6b4e}
tr:hover td{background:#f4fcf7}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.badge.on{background:#e3f7ea;color:#1f9d5d}
.badge.off{background:#fdecea;color:#c0392b}
.badge.admin{background:#e9f2ff;color:#2a6b4e}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#2a6b4e;color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;box-shadow:0 6px 20px rgba(42,107,78,0.35);display:none;z-index:1001}
.toast.show{display:block}
.vt-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.vt-mask.show{display:flex}
.vt-box{background:#fff;border-radius:18px;padding:24px 26px;max-width:460px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(42,107,78,0.3)}
.vt-box h3{color:#2a6b4e;font-size:17px;margin-bottom:14px}
.vt-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid #e2f3e9;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;color:#234a38}
.vt-item:hover{background:#f4fcf7}
.vt-item input{accent-color:#34a76c;width:16px;height:16px}
.vt-hint{color:#88a896;font-size:12.5px;margin:10px 0 14px}
.vt-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
</style>
</head>
<body>
<div class="lang-bar">
  <button type="button" id="langBtn" class="lang-btn" title="Language">🌐</button>
  <div class="lang-menu" id="langMenu">
    <div class="lang-opt" data-lang="zh-CN">简体中文</div>
    <div class="lang-opt" data-lang="zh-TW">繁體中文</div>
    <div class="lang-opt" data-lang="en">English</div>
  </div>
</div>
<div class="container">
  <div class="head"><h1 data-i18n="userAccountManage">用户账号管理</h1><div class="sub" data-i18n="userManageSub">仅管理员可添加 / 禁用 / 启用 / 删除账号，并可重置密码</div></div>

  <div class="card">
    <div class="f-label" data-i18n="newAccountLabel">新增登录账号（用户不能自助注册）</div>
    <input class="f-input" id="newEmail" data-i18n="newEmailPh" placeholder="用户邮箱，如 user@example.com" autocomplete="off">
    <input class="f-input" id="newPwd" data-i18n="newPwdPh" placeholder="初始登录密码（至少6位）" style="margin-top:10px">
    <div style="text-align:center;margin-top:16px"><button class="btn" onclick="createUser()" data-i18n="createAccount">创建账号</button></div>
  </div>

  <div class="card">
    <div class="f-label" data-i18n="allAccounts">全部账号列表</div>
    <div class="table-wrap"><table>
      <thead><tr><th data-i18n="userNameCol">用户名称</th><th data-i18n="emailCol">邮箱账号</th><th data-i18n="role">角色</th><th data-i18n="status">状态</th><th data-i18n="visibleTasks">可见任务</th><th data-i18n="actions">操作</th><th data-i18n="createdAt">创建时间</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table></div>
  </div>

  <div class="nav-row"><a class="btn plain" href="./index.html" data-i18n="backHome">返回首页</a><button class="btn danger" onclick="logout()" data-i18n="logout">退出登录</button></div>
</div>

<div class="vt-mask" id="vtMask">
  <div class="vt-box">
    <h3><span data-i18n="setVtTitle">设置可见任务：</span><span id="vtEmail" style="font-weight:700"></span></h3>
    <div id="vtList"></div>
    <div class="vt-hint" data-i18n="vtHint">勾选该用户登录后能看到的任务；不勾选任何任务 = 可看到全部任务。管理员始终可见全部任务。</div>
    <div class="vt-actions">
      <button class="btn" onclick="saveVt()" data-i18n="save">保存</button>
      <button class="btn plain" onclick="closeVt()" data-i18n="cancel">取消</button>
    </div>
  </div>
</div>
<div class="vt-mask" id="nameMask">
  <div class="vt-box">
    <h3><span data-i18n="setNameTitle">设置用户名称：</span><span id="nameEmail" style="font-weight:700"></span></h3>
    <input class="f-input" id="nameInput" data-i18n="nameInputPh" placeholder="输入用户名称（显示替代邮箱）" autocomplete="off" style="margin:12px 0">
    <div class="vt-hint" data-i18n="nameHint">设置后，登录成功界面和首页将显示用户名称替代邮箱。</div>
    <div class="vt-actions">
      <button class="btn" onclick="saveName()" data-i18n="save">保存</button>
      <button class="btn plain" onclick="closeName()" data-i18n="cancel">取消</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="./auth.js"></script>
<script src="./i18n.js"></script>
<script>
let token = null;
(async function init(){ token = await ensureToken(); if(token){ loadUsers(); loadTasks(); } })();
let users = [];
let tasks = [];
let curVtUserId = null;
const ADMIN_EMAIL = '1757349561@qq.com';

async function loadUsers(){
  const res = await authFetch('/api/all-users');
  if(res.status===403){ alert(t('noPermission')); window.location.href='./index.html'; return; }
  if(!res.ok){ logout(); return; }
  users = await res.json();
  render();
}
async function loadTasks(){
  try{
    const res = await authFetch('/api/tasks');
    if(res.ok){ tasks = await res.json(); render(); }
  }catch(e){}
}
function taskName(id){ const tt = tasks.find(x=>String(x.id)===String(id)); return tt ? tt.name : null; }
function visibleLabel(u){
  const meta = u.user_metadata || {};
  if(u.email===ADMIN_EMAIL || meta.isAdmin) return '<span style="color:#2a6b4e">'+t('all')+'</span>';
  const vt = meta.visible_tasks;
  if(!Array.isArray(vt) || !vt.length) return '<span style="color:#88a896">'+t('all')+'</span>';
  const names = vt.map(id=>taskName(id)).filter(Boolean);
  return '<span title="'+esc(vt.join(', '))+'">'+esc(names.join('、')||t('deletedTask'))+'</span>';
}
function render(){
  const body = document.getElementById('userBody');
  if(!users.length){ body.innerHTML='<tr><td colspan="7" style="text-align:center;color:#88a896;padding:24px">'+t('noAccounts')+'</td></tr>'; return; }
  body.innerHTML = users.map(u=>{
    const meta = u.user_metadata || {};
    const role = u.email===ADMIN_EMAIL || meta.isAdmin ? '<span class="badge admin">'+t('admin')+'</span>' : '<span class="badge on">'+t('normal')+'</span>';
    const st = meta.status==='disabled' ? '<span class="badge off">'+t('disabled')+'</span>' : '<span class="badge on">'+t('enabled')+'</span>';
    const nm = meta.name ? esc(meta.name) : '<span style="color:#b6c9bf">'+t('notSet')+'</span>';
    let ops;
    if(u.email===ADMIN_EMAIL){
      ops = `
        <button class="btn small plain" onclick="openName('${u.id}','${esc(u.email)}','${esc(meta.name||'')}')">${t('setName')}</button>
        <span style="color:#b6c9bf;font-size:12.5px">${t('notOperable')}</span>`;
    }else{
      ops = `
        <button class="btn small plain" onclick="openName('${u.id}','${esc(u.email)}','${esc(meta.name||'')}')">${t('setName')}</button>
        <button class="btn small plain" onclick="openVt('${u.id}','${esc(u.email)}')">${t('setVisibleTasks')}</button>
        <button class="btn small plain" onclick="resetPwd('${u.id}')">${t('resetPwd')}</button>
        ${meta.status==='disabled'
          ? `<button class="btn small" onclick="setStatus('${u.id}','active')">${t('enable')}</button>`
          : `<button class="btn small danger" onclick="setStatus('${u.id}','disabled')">${t('disable')}</button>`}
        <button class="btn small danger" onclick="delUser('${u.id}')">${t('delUser')}</button>`;
    }
    return `<tr>
      <td>${nm}</td><td>${esc(u.email)}</td><td>${role}</td><td>${st}</td><td>${visibleLabel(u)}</td><td>${ops}</td>
      <td>${new Date(u.created_at).toLocaleString('zh-CN',{hour12:false})}</td>
    </tr>`;
  }).join('');
}

let curNameUserId = null;
function openName(uid, email, curName){
  curNameUserId = uid;
  document.getElementById('nameEmail').textContent = email;
  document.getElementById('nameInput').value = curName || '';
  document.getElementById('nameMask').classList.add('show');
}
function closeName(){ document.getElementById('nameMask').classList.remove('show'); curNameUserId=null; }
async function saveName(){
  if(!curNameUserId) return;
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ toast(t('nameRequired')); return; }
  const res = await authFetch('/api/set-user-name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:curNameUserId, name})});
  if(!res.ok){ const d = await res.json().catch(()=>({})); toast(d.error||t('savedFail')); return; }
  toast(t('nameSaved'));
  closeName();
  loadUsers();
}

function openVt(uid, email){
  curVtUserId = uid;
  document.getElementById('vtEmail').textContent = email;
  const u = users.find(x=>x.id===uid);
  const cur = new Set(((u?.user_metadata||{}).visible_tasks||[]).map(String));
  const list = document.getElementById('vtList');
  if(!tasks.length){ list.innerHTML = '<div style="color:#88a896;padding:10px">'+t('noTasks')+'</div>'; }
  else{
    list.innerHTML = tasks.map(tt=>`
      <label class="vt-item"><input type="checkbox" value="${tt.id}" ${cur.has(String(tt.id))?'checked':''}> ${esc(tt.name)}</label>
    `).join('');
  }
  document.getElementById('vtMask').classList.add('show');
}
function closeVt(){ document.getElementById('vtMask').classList.remove('show'); curVtUserId=null; }
async function saveVt(){
  if(!curVtUserId) return;
  const ids = [...document.querySelectorAll('#vtList input:checked')].map(i=>i.value);
  const res = await authFetch('/api/set-user-tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:curVtUserId, taskIds: ids})});
  if(!res.ok){ const d = await res.json().catch(()=>({})); toast(d.error||t('savedFail')); return; }
  toast(t('vtSaved'));
  closeVt();
  loadUsers();
}

async function createUser(){
  const email = document.getElementById('newEmail').value.trim();
  const pwd = document.getElementById('newPwd').value.trim();
  if(!email || !pwd){ toast(t('emailPwdRequired')); return; }
  if(users.some(u=>u.email===email)){ toast(t('emailExists')); return; }
  const res = await authFetch('/api/create-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
  const data = await res.json();
  if(!res.ok){ toast(data.error||t('createFail')); return; }
  toast(t('createOk'));
  document.getElementById('newEmail').value=''; document.getElementById('newPwd').value='';
  loadUsers();
}
async function setStatus(uid,status){
  if(!confirm(status==='disabled'?t('confirmDisable'):t('confirmEnable'))) return;
  const res = await authFetch('/api/set-user-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,status})});
  if(!res.ok){ toast(t('opFailed')); return; }
  toast(status==='disabled'?t('disabledOk'):t('enabledOk'));
  loadUsers();
}
async function delUser(uid){
  if(!confirm(t('confirmDelUser'))) return;
  const res = await authFetch('/api/user/'+uid,{method:'DELETE'});
  if(!res.ok){ toast(t('delFail')); return; }
  toast(t('userDeleted'));
  loadUsers();
}
function resetPwd(uid){
  const np = prompt(t('resetPwdPh'));
  if(!np) return;
  if(!confirm(t('confirmResetPwd'))) return;
  (async()=>{
    const res = await authFetch('/api/reset-pwd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,newPwd:np})});
    const data = await res.json();
    if(!res.ok){ toast(data.error||t('resetFail')); return; }
    toast(t('resetOk'));
    loadUsers();
  })();
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
</script>
</body>
</html>
