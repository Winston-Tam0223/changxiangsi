<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录｜长相思匹配时间发布系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{background:linear-gradient(160deg,#e9f8ef 0%,#f6fcf8 55%,#edfaf2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative}
.lang-bar{position:absolute;top:18px;right:18px;z-index:10}
.lang-bar select{padding:7px 12px;border-radius:99px;border:1px solid #b8e0ca;background:rgba(255,255,255,0.9);color:#2a6b4e;font-size:13px;outline:none;cursor:pointer}
.wrap{max-width:420px;width:100%}
.logo{text-align:center;margin-bottom:26px}
.logo .brand-icon{width:96px;height:96px;margin:0 auto 12px;border-radius:22px;display:block;overflow:hidden;box-shadow:0 8px 22px rgba(74,179,122,0.35)}
.logo .brand-icon img{width:100%;height:100%;display:block;object-fit:cover}
.logo h1{font-size:26px;color:#2a6b4e;letter-spacing:1px}
.logo .welcome{font-size:19px;color:#4c8068;font-weight:600;margin-top:10px}
.logo .sub{color:#6d9480;font-size:14.5px;margin-top:6px}
.login-card{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:20px;padding:28px;box-shadow:0 8px 26px rgba(84,168,125,0.16);border:1px solid rgba(120,190,152,0.3)}
.field{margin-bottom:15px}
.field label{display:block;color:#4c8068;font-size:14px;margin-bottom:7px}
.field input{width:100%;padding:13px 15px;border-radius:13px;border:1px solid #b8e0ca;background:#fff;font-size:16px;outline:none;color:#234a38}
.field input:focus{border-color:#5fc98a;box-shadow:0 0 0 3px rgba(95,201,138,0.18)}
.opt-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.opt-row label{display:flex;align-items:center;gap:7px;cursor:pointer;color:#4c8068;font-size:14px;user-select:none}
.opt-row label input{width:16px;height:16px;accent-color:#34a76c;cursor:pointer}
.forgot{color:#2a6b4e;font-size:13.5px;text-decoration:none;cursor:pointer;border:none;background:none;padding:0}
.forgot:hover{text-decoration:underline}
.login-btn{width:100%;padding:14px;border-radius:99px;border:none;background:linear-gradient(135deg,#56c98a,#34a76c);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(74,179,122,0.3)}
.login-btn:hover{opacity:0.92}
.login-msg{text-align:center;margin:12px 0 4px;color:#c0392b;font-weight:500;min-height:20px;font-size:14px}
.entry-row{display:flex;justify-content:center;gap:34px;margin-top:26px}
.entry{display:flex;flex-direction:column;align-items:center;gap:6px;color:#5b9377;font-size:13px;text-decoration:none;cursor:pointer}
.entry .ico{width:44px;height:44px;border-radius:50%;background:#e6f6ee;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #cdeedc}
.entry:hover .ico{background:#d7f1e3}
.welcome-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:999}
.welcome-mask.show{display:flex}
.welcome-box{background:#fff;border-radius:20px;padding:36px 48px;text-align:center;box-shadow:0 8px 34px rgba(42,107,78,0.3);max-width:92vw}
.welcome-box .big{font-size:54px}
.welcome-box p{font-size:21px;color:#2a6b4e;font-weight:600;margin-top:10px}
.welcome-box .welcome-tip{font-size:18px;color:#c0392b;font-weight:700;margin-top:15px;max-width:340px;line-height:1.7;letter-spacing:0.4px}
.welcome-box span{display:block;font-size:13px;color:#6d9480;margin-top:8px}
</style>
</head>
<body>
<div class="lang-bar">
  <select id="langSelect" aria-label="language">
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="en">English</option>
  </select>
</div>
<div class="wrap">
  <div class="logo">
    <div class="brand-icon"><img src="./logo.png" alt="长相思联盟"></div>
    <h1 data-i18n="brand">长相思联盟</h1>
    <div class="welcome" data-i18n="welcomeBack">欢迎回来</div>
    <div class="sub" data-i18n="loginSub">登录 长相思匹配时间发布系统</div>
  </div>
  <div class="login-card">
    <div class="login-msg" id="loginMsg"></div>
    <form onsubmit="return doLogin(event)">
      <div class="field"><label data-i18n="email">邮箱地址</label><input id="email" data-i18n="emailPh" placeholder="输入账号邮箱" autocomplete="off"></div>
      <div class="field"><label data-i18n="password">密码</label><input id="pwd" data-i18n="pwdPh" type="password" placeholder="输入密码"></div>
      <div class="opt-row">
        <label><input type="checkbox" id="rememberMe"> <span data-i18n="rememberMeShort">记住我</span></label>
        <button type="button" class="forgot" id="forgotPwd" onclick="showForgotTip()" data-i18n="forgotPwd">忘记密码？</button>
      </div>
      <button class="login-btn" data-i18n="loginBtn">登 录</button>
    </form>
  </div>
  <div class="entry-row">
    <a class="entry" href="javascript:void(0)" onclick="alert(t('secureLogin'))"><div class="ico">🛡️</div><span data-i18n="secureLogin">安全登录</span></a>
    <a class="entry" href="./index.html"><div class="ico">⏰</div><span data-i18n="timePublish">时间发布</span></a>
    <a class="entry" href="javascript:void(0)" onclick="alert(t('smartSystem'))"><div class="ico">🧠</div><span data-i18n="smartSystem">智能系统</span></a>
  </div>
</div>

<div class="welcome-mask" id="welcomeMask">
  <div class="welcome-box"><div class="big">👋</div><p id="welcomeText"></p><p class="welcome-tip" id="welcomeTip"></p><span id="welcomeSub"></span></div>
</div>

<script src="./auth.js"></script>
<script src="./i18n.js"></script>
<script>
// 已保存的账号密码自动填充（即使退出登录后仍保留，无需重新输入）
const savedEmail = localStorage.getItem('sb_saved_email');
const savedPwd = localStorage.getItem('sb_saved_pwd');
if(savedEmail){
  try{ document.getElementById('email').value = decodeURIComponent(escape(atob(savedEmail))); }catch(e){}
}
if(savedPwd){
  try{ document.getElementById('pwd').value = decodeURIComponent(escape(atob(savedPwd))); }catch(e){}
}
// 勾选状态：保存过账号则默认勾选
document.getElementById('rememberMe').checked = savedEmail ? true : getRemember();

// 已登录且会话有效则直接进入首页（token 失效时自动刷新，无需重新登录）
(async function(){
  const lang = localStorage.getItem('sb_lang');
  if(lang) { try{ document.getElementById('langSelect').value = lang; }catch(e){} }
  const tt = await ensureToken();
  if(tt){ window.location.href='./index.html'; }
})();

function showForgotTip(){
  alert(t('forgotPwdTip'));
}

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const remember = document.getElementById('rememberMe').checked;
  const msg = document.getElementById('loginMsg');
  if(!email || !pwd){ msg.textContent = t('emailPwdRequired'); return; }
  msg.textContent = t('login') + '...';
  try{
    const res = await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pwd})
    });
    const data = await res.json();
    if(!res.ok){
      const errMap = {'账号或密码错误': t('errBadCred'), '该账号已被管理员禁止登录': t('errDisabled')};
      msg.textContent = errMap[data.error] || data.error || t('loginFailed');
      return;
    }
    // 记住我：勾选=保存账号密码+长期自动登录；未勾选=仅本次会话
    saveAuth(data.token, data.refresh_token, remember);
    saveUserInfo(data.user.email, data.user.isAdmin);
    if(remember){
      // 保存账号和密码（base64 编码存储），退出登录后仍保留，下次打开自动填充
      localStorage.setItem('sb_saved_email', btoa(unescape(encodeURIComponent(email))));
      localStorage.setItem('sb_saved_pwd', btoa(unescape(encodeURIComponent(pwd))));
      localStorage.setItem('sb_remembered_email', email);
    }else{
      localStorage.removeItem('sb_saved_email');
      localStorage.removeItem('sb_saved_pwd');
      localStorage.removeItem('sb_remembered_email');
    }
    const name = data.user.name || data.user.email;
    document.getElementById('welcomeText').textContent = t('loginSuccessWelcome', {name});
    document.getElementById('welcomeTip').textContent = t('loginSuccessTip');
    document.getElementById('welcomeSub').textContent = t('enterHomeIn');
    document.getElementById('welcomeMask').classList.add('show');
    setTimeout(()=>{ window.location.href='./index.html'; }, 3000);
  }catch(err){
    msg.textContent = t('errConn');
  }
}
</script>
</body>
</html>
