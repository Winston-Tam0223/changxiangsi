<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录｜长相思匹配时间发布系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",Roboto,sans-serif}
body{background:linear-gradient(160deg,#e9f8ef 0%,#f6fcf8 55%,#edfaf2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{max-width:420px;width:100%}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:30px;color:#2a6b4e;letter-spacing:1px}
.logo p{color:#6d9480;font-size:15px;margin-top:8px}
.login-card{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:20px;padding:28px;box-shadow:0 8px 26px rgba(84,168,125,0.16);border:1px solid rgba(120,190,152,0.3)}
.field{margin-bottom:16px}
.field label{display:block;color:#4c8068;font-size:14px;margin-bottom:7px}
.field input{width:100%;padding:13px 15px;border-radius:13px;border:1px solid #b8e0ca;background:#fff;font-size:16px;outline:none;color:#234a38}
.field input:focus{border-color:#5fc98a;box-shadow:0 0 0 3px rgba(95,201,138,0.18)}
.login-btn{width:100%;padding:14px;border-radius:99px;border:none;background:linear-gradient(135deg,#56c98a,#34a76c);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(74,179,122,0.3)}
.login-btn:hover{opacity:0.92}
.login-msg{text-align:center;margin:12px 0 4px;color:#c0392b;font-weight:500;min-height:20px}
.welcome-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:999}
.welcome-mask.show{display:flex}
.welcome-box{background:#fff;border-radius:20px;padding:36px 48px;text-align:center;box-shadow:0 8px 34px rgba(42,107,78,0.3)}
.welcome-box .big{font-size:54px}
.welcome-box p{font-size:22px;color:#2a6b4e;font-weight:600;margin-top:10px}
.welcome-box span{display:block;font-size:13px;color:#6d9480;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><h1>长相思匹配时间发布系统</h1><p>登录</p></div>
  <div class="login-card">
    <div class="login-msg" id="loginMsg"></div>
    <form onsubmit="return doLogin(event)">
      <div class="field"><label>邮箱地址</label><input id="email" placeholder="输入账号邮箱" autocomplete="off"></div>
      <div class="field"><label>密码</label><input id="pwd" type="password" placeholder="输入密码"></div>
      <button class="login-btn">登 录</button>
    </form>
  </div>
</div>

<div class="welcome-mask" id="welcomeMask">
  <div class="welcome-box"><div class="big">👋</div><p id="welcomeText"></p><span>3 秒后自动进入首页</span></div>
</div>

<script>
async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!email || !pwd){ msg.textContent='请输入账号和密码'; return; }
  msg.textContent='登录中...';
  try{
    const res = await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pwd})
    });
    const data = await res.json();
    if(!res.ok){
      msg.textContent = data.error || '登录失败';
      return;
    }
    localStorage.setItem('sb_token', data.token);
    localStorage.setItem('loginUser', data.user.email);
    localStorage.setItem('loginIsAdmin', data.user.isAdmin);
    document.getElementById('welcomeText').textContent = '欢迎，'+data.user.email;
    document.getElementById('welcomeMask').classList.add('show');
    setTimeout(()=>{ window.location.href='./index.html'; }, 3000);
  }catch(err){
    msg.textContent='无法连接服务器，请稍后再试';
  }
}
</script>
</body>
</html>
